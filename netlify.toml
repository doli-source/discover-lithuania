[build]
  publish = "."

[[plugins]]
  package = "netlify-plugin-submit-sitemap"
  [plugins.inputs]
    baseUrl = "https://lithuaniadiscovery.com"
    sitemapPath = "/sitemap.xml"
    providers = ["google", "bing"]

[[redirects]]
  from = "https://discover-lithuania.netlify.app/*"
  to = "https://lithuaniadiscovery.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/region-images.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
