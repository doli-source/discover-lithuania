[build]
  publish = "."

[[redirects]]
  from = "https://discover-lithuania.netlify.app/*"
  to = "https://lithuaniadiscovery.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/region-images.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
